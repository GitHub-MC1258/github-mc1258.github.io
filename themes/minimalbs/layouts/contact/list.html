{{ define "main" }}
<main class="container contact-form">
  <div class="text-center mt-5">
    <h4>Merci de compléter</h4>
    <h4>ce formulaire</h4>
  </div>

  <!-- Identifiant id="contact-form" ajouté pour le script -->
  <form id="contact-form" action="https://formspree.io/f/mykoqlnl" method="POST">

    <!-- Protection anti-spam standard Formspree -->
    <input type="text" name="_gotcha" style="display:none">

    <div class="mb-3">
      <label class="form-label">Nom</label>
      <input type="text" name="name" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Prénom</label>
      <input type="text" name="firstname" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="_replyto" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Message</label>
      <textarea name="message" class="form-control" rows="5" required></textarea>
    </div>

    <div class="text-center">
      <small class="text-muted">Les données envoyées via ce formulaire servent uniquement à vous répondre à votre message.</small>
    </div>

    <div class="text-center mt-4">
      <button type="submit" id="submit-btn" class="btn btn-primary">Envoyer</button>
      <!-- Zone pour afficher un message d'erreur si besoin -->
      <div id="form-status" class="mt-3"></div>
    </div>
  </form>
</main>

<script>
  const form = document.getElementById("contact-form");
  const button = document.getElementById("submit-btn");
  const status = document.getElementById("form-status");

  async function handleSubmit(event) {
    event.preventDefault();

    // On prépare l'affichage pendant l'envoi
    button.disabled = true;
    button.innerHTML = "Envoi en cours...";

    const data = new FormData(event.target);

    try {
      const response = await fetch(event.target.action, {
        method: form.method,
        body: data,
        headers: {
          'Accept': 'application/json'
        }
      });

      if (response.ok) {
        // Succès : Redirection manuelle vers votre page merci
        window.location.href = "{{ "merci/" | absURL }}";
      } else {
        // Erreur retournée par Formspree
        const result = await response.json();
        button.disabled = false;
        button.innerHTML = "Envoyer";
        status.innerHTML = `<span class="text-danger">Erreur : ${result.errors.map(e => e.message).join(", ")}</span>`;
      }
    } catch (error) {
      // Erreur réseau
      button.disabled = false;
      button.innerHTML = "Envoyer";
      status.innerHTML = `<span class="text-danger">Impossible de contacter le serveur.</span>`;
    }
  }

  form.addEventListener("submit", handleSubmit);
</script>
{{ end }}
